<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikigai Pastes</title>
    <!-- Bump ?v= whenever style.css or script.js changes so browsers skip their cached copies -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-header">
      <h5>🌸 Ｉｋｉｇａｉ　Ｐａｓｔｅｓ 🌸</h5>
      <button id="copy-shipping-button" onclick="copyShippingPhrase()" title="Copy &quot;Complimentary Ground Shipping&quot; to Clipboard">🚚 Complimentary Ground Shipping</button>
      <button class="cs-note-button" data-note="exchange" onclick="copyCsNote(this)" title="Copy a dated Exchange note to Clipboard">🔁 CS Exchange</button>
      <button class="cs-note-button" data-note="replacement" onclick="copyCsNote(this)" title="Copy a dated Replacement note to Clipboard">📦 CS Replacement</button>
      <button class="cs-note-button" data-note="rmaDraftDeletion" onclick="copyCsNote(this)" title="Copy a dated RMA Draft Deletion note to Clipboard">🗑️ RMA Draft Deletion</button>
      <button id="cs-initials-button" onclick="openInitialsPicker()" title="Change the initials used in CS notes">👤 Set initials</button>
    </div>
    <div id="cs-initials-picker" style="display: none;">
      <span id="cs-initials-prompt">Who's copying this note? Pick your initials:</span>
      <span id="cs-initials-options" class="option-buttons"></span>
      <input type="text" id="cs-initials-custom" maxlength="4" placeholder="Other">
      <button onclick="applyCustomInitials()">Use</button>
      <button onclick="closeInitialsPicker()" title="Cancel">✖</button>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs">
      <button class="tab-button active" data-tab="engravings">Engravings</button>
      <button class="tab-button" data-tab="sku-lookup">SKU Lookup</button>
    </div>

    <!-- Engravings Tab Content -->
    <div class="tab-content" id="engravings" style="display: block;">
      <div id="case-list"></div>
      <!-- Add Case Button -->
      <button class="emoji-button" onclick="addCase()" title="Add Case">➕</button>
      <!-- Generate and Copy Notes Button -->
      <button class="emoji-button" onclick="generateAndCopyNotes()" title="Generate and Copy NOTES">📋</button>
      <pre id="notes-output"></pre>
    </div>

    <!-- SKU Lookup Tab Content -->
    <div class="tab-content" id="sku-lookup" style="display: none;">
      <div id="sku-lookup-interface">
        <!-- Case Type Selection -->
        <label><strong>Case Type:</strong></label>
        <div id="sku-case-type-options" class="option-buttons"></div>

        <!-- Dynamic Options -->
        <div id="sku-options"></div>

        <!-- SKU Display -->
        <div id="sku-display">
          <label for="sku-output"><strong>SKU:</strong></label>
          <input type="text" id="sku-output" readonly>
          <button onclick="copySKU()" title="Copy SKU to Clipboard">📋</button>
        </div>
      </div>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
